/* Мобильное приложение: градиентная шапка с кольцом прогресса, плавающая навигация, карточки. Темы и языки переключаются на лету. */
:root {
  --bg: #f4f3fb; --card: #ffffff; --card2: #ece9fb; --ink: #17162e; --muted: #67658d; --line: #e2dff3;
  --a1: #6a45f0; --a2: #0e9f8e; --a3: #e0457f; --ok: #12906a; --warn: #b36b00; --bad: #c43a3a;
  --hero: linear-gradient(140deg, #5b3df0 0%, #8a4fff 55%, #1fb5c9 120%);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b1a; --card: #15152b; --card2: #1d1d3a; --ink: #f3f2ff; --muted: #a3a1c4; --line: #26264a;
    --a1: #9a7dff; --a2: #3fdcc6; --a3: #ff7aa8; --ok: #4fd8a2; --warn: #f2b24c; --bad: #ff7d7d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b1a; --card: #15152b; --card2: #1d1d3a; --ink: #f3f2ff; --muted: #a3a1c4; --line: #26264a;
  --a1: #9a7dff; --a2: #3fdcc6; --a3: #ff7aa8; --ok: #4fd8a2; --warn: #f2b24c; --bad: #ff7d7d;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-top: calc(14px + var(--top));
  padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; }
h1 { font-size: 27px; line-height: 1.15; margin: 0 0 4px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
p { margin: 0; }
.sub { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
svg { display: block; }
.ico svg, nav svg, .btn svg, .theme-btn svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* шапка экрана с кнопкой темы */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.head > div { min-width: 0; }
.theme-btn { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; transition: transform .12s; }
.theme-btn:active { transform: scale(.92) rotate(15deg); }
.theme-btn svg { width: 22px; height: 22px; }
.theme-btn .sun { color: var(--warn); }
.theme-btn .moon { color: var(--a1); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; min-width: 0; }

/* герой */
.hero { background: var(--hero); color: #fff; border: 0; border-radius: 26px; padding: 20px; position: relative; overflow: hidden;
  box-shadow: 0 14px 34px -14px rgba(106, 69, 240, .6); }
.hero::after { content: ""; position: absolute; width: 200px; height: 200px; right: -60px; top: -70px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.22), transparent 70%); pointer-events: none; }
.hero .top { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .trk { stroke: rgba(255,255,255,.25); }
.ring .val { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1; text-align: center; }
.hero .nums b { display: block; font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.hero .nums span { font-size: 12px; opacity: .85; }
.hero .msg { position: relative; z-index: 1; margin-top: 16px; padding: 11px 14px; border-radius: 14px; background: rgba(255,255,255,.16); font-size: 14px; font-weight: 500; }

/* плитки */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 16px; border-radius: 20px; border: 1px solid var(--line);
  background: var(--card); display: flex; flex-direction: column; gap: 12px; min-height: 118px; transition: transform .15s; }
.tile:active { transform: scale(.97); }
.tile .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: var(--g); }
.tile .ico svg { width: 22px; height: 22px; }
.tile strong { display: block; font-size: 16px; font-weight: 700; }
.tile small { color: var(--muted); font-size: 13px; line-height: 1.3; display: block; margin-top: 2px; }
.mini { flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--g); }
.mini svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.g1 { --g: linear-gradient(135deg, #6a45f0, #9a6bff); } .g2 { --g: linear-gradient(135deg, #0ea58f, #35d7c0); }
.g3 { --g: linear-gradient(135deg, #e0457f, #ff8aa8); } .g4 { --g: linear-gradient(135deg, #e08a1f, #f5c04a); }

/* задачи */
.task { display: flex; align-items: center; gap: 13px; width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer;
  padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); transition: transform .12s, background .2s, border-color .2s; }
.task:active { transform: scale(.985); }
.task .box { flex: none; width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; transition: all .2s; }
.task .box svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.task[aria-pressed="true"] { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 9%, var(--card)); }
.task[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: #fff; animation: pop .3s ease; }
.task[aria-pressed="true"] .t { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
@keyframes pop { 50% { transform: scale(1.25); } }
.star { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--warn); white-space: nowrap; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--warn) 14%, transparent); }
.bar { height: 10px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a2)); border-radius: 99px; transition: width .4s; }

/* формы */
input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--card2); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; min-width: 0; flex: 1 1 120px; }
input::placeholder { color: var(--muted); }
.stack > input { flex: none; width: 100%; }
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 14px; padding: 12px 20px; color: #fff; background: linear-gradient(135deg, #5b3df0, #8a4fff);
  display: inline-flex; gap: 8px; align-items: center; justify-content: center; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.btn.soft { background: var(--card2); color: var(--ink); }
.btn.wide { width: 100%; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; background: var(--card2); border-radius: 16px; }
.seg button { font: inherit; font-weight: 600; border: 0; padding: 10px 6px; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.18); }

/* график и неделя */
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--a1); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart circle { fill: var(--card); stroke: var(--a1); stroke-width: 3; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 130px; }
.week div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; font-size: 12px; color: var(--muted); }
.week i { width: 100%; max-width: 32px; border-radius: 10px 10px 5px 5px; background: var(--card2); min-height: 6px; transition: height .4s; }
.week i.ok { background: linear-gradient(180deg, var(--a2), var(--ok)); }
.week i.part { background: color-mix(in srgb, var(--a1) 60%, var(--card2)); }
.empty { padding: 22px 8px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 54px; height: 54px; fill: none; stroke: var(--a1); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }

/* база */
details { border: 1px solid var(--line); border-radius: 18px; background: var(--card); padding: 0 16px; }
summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--a1); font-size: 22px; font-weight: 500; }
details[open] summary::after { content: "–"; }
details .body { padding: 0 0 16px; display: flex; flex-direction: column; gap: 10px; }
details ul { margin: 0; padding-left: 18px; }
.src { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--a1); }

/* привычки в профиле */
.hab { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hab:last-child { border-bottom: 0; }
.hab span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.hab button { font: inherit; cursor: pointer; background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 10px; font-size: 18px; line-height: 1; }
.hab button.on { color: var(--warn); }
.hab button.x:hover { color: var(--bad); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch button { flex: none; width: 50px; height: 30px; border-radius: 99px; border: 0; cursor: pointer; background: var(--card2); position: relative; transition: background .2s; }
.switch button::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch button[aria-checked="true"] { background: var(--a1); }
.switch button[aria-checked="true"]::after { transform: translateX(20px); }

/* навигация */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
nav .in { pointer-events: auto; max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  border-radius: 26px; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line); box-shadow: 0 10px 30px -10px rgba(0,0,0,.35); }
nav button { font: inherit; font-size: 11px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 20px; transition: background .2s, color .2s; }
nav button svg { width: 23px; height: 23px; }
nav button[aria-current="page"] { color: #fff; background: linear-gradient(135deg, #5b3df0, #8a4fff); }

.view { animation: in .28s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    if (el.dataset.star !== undefined) {
      state.habits = habits().map(function (h) { return { k: h.k, t: h.t, min: h.min }; });
      var s = state.habits[+el.dataset.star]; s.min = !s.min; saveHabits(); render(true); return;
    }
    if (el.dataset.rm !== undefined) {
      state.habits = habits().map(function (h) { return { k: h.k, t: h.t, min: h.min }; });
      state.habits.splice(+el.dataset.rm, 1);
      saveHabits(); render(true); return;
    }
    var a = el.dataset.act;
    if (a === "theme") { state.theme = effTheme() === "dark" ? "light" : "dark"; saveProfile(); applyTheme(); haptic(); render(true); }
    else if (a === "addw") {
      var v = parseFloat(document.getElementById("w-in").value.replace(",", "."));
      if (!(v >= 30 && v <= 250)) { document.getElementById("w-in").focus(); return; }
      var wk = dkey(new Date()); state.weights[wk] = Math.round(v * 10) / 10; saveWeight(wk); haptic("ok"); render(true);
    } else if (a === "saveprof") {
      state.name = document.getElementById("p-name").value.trim();
      state.goal = document.getElementById("p-goal").value.trim(); saveProfile(); haptic("ok"); go("home");
    } else if (a === "addh") {
      var inp = document.getElementById("h-in"), tx = inp.value.trim();
      if (!tx) { inp.focus(); return; }
      var cur = habits();
      if (cur.length >= 20) { inp.value = ""; inp.placeholder = t("max_ph"); return; }
      state.habits = cur.map(function (h) { return { k: h.k, t: h.t, min: h.min }; });
      state.habits.push({ k: "c" + Date.now().toString(36), t: tx.slice(0, 60), min: false });
      saveHabits(); render(true);
    } else if (a === "fs") { state.fs = state.fs === false; saveProfile(); render(true); }
    else if (a === "addhome") { try { tg.addToHomeScreen(); } catch (e) {} }
    else if (a === "askdel") { confirmDel = true; render(true); }
    else if (a === "nodel") { confirmDel = false; render(true); }
    else if (a === "del") { state = emptyState(); wipe(); confirmDel = false; document.documentElement.lang = lang(); applyTheme(); go("home"); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "w-in") { e.preventDefault(); document.querySelector("[data-act=addw]").click(); }
    if (e.target.id === "h-in") { e.preventDefault(); document.querySelector("[data-act=addh]").click(); }
  });
  setupTelegram();
  render();
  loadCloud(function (changed) { if (changed) render(true); });
})();
</script>
</body>
